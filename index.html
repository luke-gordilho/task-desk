<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MoveDot · Tasks</title>
<style>
:root{font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#23302c;background:#f4f6f2}*{box-sizing:border-box}body{margin:0}header{background:#183b32;color:white;padding:30px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between}h1{margin:7px 0;font-size:30px;letter-spacing:-1px}header small{color:#b2c9bb;text-transform:uppercase;letter-spacing:2px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #ced8d0;border-radius:9px;padding:10px 16px;background:white;color:#183b32}.primary{background:#c5eea5;border-color:#c5eea5;font-weight:650}main{max-width:1250px;margin:auto;padding:28px 24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:white;padding:20px;border:1px solid #e0e6de;border-radius:12px}.stat strong{font-size:29px;display:block;margin-top:8px}.toolbar{display:flex;gap:10px;margin:26px 0 18px;flex-wrap:wrap}input,select,textarea{border:1px solid #ced8d0;border-radius:8px;background:white;padding:11px;color:#23302c}.toolbar input{flex:1;min-width:180px}.table{overflow:auto;background:white;border:1px solid #e0e6de;border-radius:12px}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:1px;background:#edf2eb;color:#617065}td,th{padding:16px;border-bottom:1px solid #e9eee7}tr:last-child td{border:0}td small{display:block;color:#728075;margin-top:6px;max-width:420px;white-space:pre-wrap}.tag{display:inline-block;padding:5px 9px;border-radius:6px;background:#eef2ed;font-size:12px;white-space:nowrap}.done{background:#dff0dd}.blocked{background:#fbe7d9}.progress{background:#e0eafc}.overdue{color:#b3422a}#empty{text-align:center;padding:60px 20px;color:#6b796f}dialog{border:0;border-radius:16px;padding:28px;width:620px;max-width:94vw;box-shadow:0 25px 100px #0003}dialog::backdrop{background:#142b2370}dialog h2{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600}.full{grid-column:1/-1}textarea{resize:vertical;min-height:75px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}footer{margin-top:18px;color:#728075;font-size:12px}#error{color:#ad3729;white-space:pre-wrap}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}header{padding:24px}.fields{grid-template-columns:1fr}.full{grid-column:auto}td,th{padding:12px}}
</style></head><body><header><div><small>MoveDot workspace</small><h1>Your work, in view.</h1><div>One place for tasks across your projects.</div></div><button class="primary" id="new">+ New task</button></header><main><div class="stats" id="stats"></div><div class="toolbar"><input id="search" aria-label="Search tasks" placeholder="Search tasks, notes, or next actions…"><select id="project" aria-label="Filter project"><option value="">All projects</option></select><select id="status" aria-label="Filter status"><option value="">Active tasks</option><option>All statuses</option><option>To do</option><option>In progress</option><option>Blocked</option><option>Done</option></select><select id="priority" aria-label="Filter priority"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select><button id="export">Export JSON</button></div><p id="error" role="alert"></p><div class="table"><table><thead><tr><th>Task / next action</th><th>Project</th><th>Status</th><th>Priority</th><th>Due</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden></div></div><footer>Saved on this Mac · SQLite storage · <span id="count"></span></footer></main>
<dialog id="editor"><form id="form"><h2 id="heading">New task</h2><div class="fields"><input type="hidden" name="id"><label class="full">Task title<input name="title" required maxlength="500" autofocus></label><label>Project<input name="project" list="projects" placeholder="Choose or add a project"><datalist id="projects"></datalist></label><label>Owner<input name="owner" value="Luke"></label><label>Status<select name="status"><option>To do</option><option>In progress</option><option>Blocked</option><option>Done</option></select></label><label>Priority<select name="priority"><option>Medium</option><option>High</option><option>Low</option></select></label><label>Due date<input type="date" name="due_date"></label><label class="full">Next action<textarea name="next_action" placeholder="What moves this forward?"></textarea></label><label class="full">Notes<textarea name="notes" placeholder="Context, decisions, or links"></textarea></label></div><p id="saveError" role="alert"></p><div class="actions"><button type="button" id="cancel">Cancel</button><button type="submit" class="primary" id="save">Save task</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s);let tasks=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/tasks');if(!r.ok)throw Error('Could not load tasks');const data=await r.json();tasks=data.tasks;const chosen=$('#project').value;$('#project').innerHTML='<option value="">All projects</option>'+data.projects.map(p=>`<option>${esc(p)}</option>`).join('');$('#project').value=chosen;$('#projects').innerHTML=data.projects.map(p=>`<option value="${esc(p)}">`).join('');$('#error').textContent='';render()}catch(e){$('#error').textContent=e.message+'. Check that the task tracker is running.'}}
function render(){const q=$('#search').value.toLowerCase(),p=$('#project').value,s=$('#status').value,priority=$('#priority').value;$('#stats').innerHTML=['To do','In progress','Blocked','Done'].map(s=>`<div class="stat">${s}<strong>${tasks.filter(t=>t.status===s).length}</strong></div>`).join('');const found=tasks.filter(t=>(!p||t.project===p)&&(!priority||t.priority===priority)&&(s==='All statuses'||(s?t.status===s:t.status!=='Done'))&&[t.title,t.notes,t.next_action,t.owner,t.project].join(' ').toLowerCase().includes(q));const today=new Date().toLocaleDateString('en-CA');$('#rows').innerHTML=found.map(t=>`<tr><td><b>${esc(t.title)}</b><small>${esc(t.next_action)}</small></td><td>${esc(t.project)||'—'}</td><td><span class="tag ${t.status==='Done'?'done':t.status==='Blocked'?'blocked':t.status==='In progress'?'progress':''}">${esc(t.status)}</span></td><td>${esc(t.priority)}</td><td class="${t.due_date&&t.due_date<today&&t.status!=='Done'?'overdue':''}">${esc(t.due_date)||'—'}</td><td><button data-id="${t.id}" aria-label="Edit ${esc(t.title)}">Edit</button></td></tr>`).join('');$('#empty').hidden=!!found.length;$('#empty').textContent=tasks.length?'No tasks match these filters.':'A clear starting point. Add your first task above.';$('#count').textContent=`${found.length} shown · ${tasks.length} total`}
function edit(id){$('#form').reset();$('#saveError').textContent='';const t=tasks.find(t=>t.id===id);$('#heading').textContent=t?'Edit task':'New task';$('#form').elements.id.value='';if(t)for(const [k,v]of Object.entries(t))if($('#form').elements[k])$('#form').elements[k].value=v;$('#editor').showModal()}
$('#new').onclick=()=>edit();$('#cancel').onclick=()=>$('#editor').close();$('#rows').onclick=e=>{const b=e.target.closest('button[data-id]');if(b)edit(Number(b.dataset.id))};for(const id of ['search','project','status','priority'])$('#'+id).addEventListener('input',render);
$('#form').onsubmit=async e=>{e.preventDefault();$('#save').disabled=true;try{const body=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error);$('#editor').close();await load()}catch(e){$('#saveError').textContent=e.message}finally{$('#save').disabled=false}};
$('#export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));a.href=url;a.download='movedot-tasks.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};load();window.addEventListener('focus',load);
</script></body></html>
